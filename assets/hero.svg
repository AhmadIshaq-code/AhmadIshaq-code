<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Ahmad Ishaq</title>
  <desc id="hero-desc">Computer Science student building AI and agentic AI systems. Motif: understand, route, use tools, respond.</desc>

  <style>
    .sans { font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "DejaVu Sans Mono", monospace; }

    /* Everything is fully visible by default. The animation only hides an element
       during its start delay (fill-mode: backwards), so if a viewer ignores CSS
       animation, nothing is ever left invisible. */
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink  { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }

    .step   { animation: reveal 0.5s ease-out backwards; }
    .s1 { animation-delay: 0.3s; }
    .s2 { animation-delay: 0.9s; }
    .s3 { animation-delay: 1.5s; }
    .s4 { animation-delay: 2.1s; }
    .cursor { animation: blink 1s steps(1, end) 2.7s 4 backwards; } /* hidden until 'respond' lands, then blinks 4x and stays on */

    @media (prefers-reduced-motion: reduce) {
      .step, .cursor { animation: none; }
    }
  </style>

  <!-- panel -->
  <rect width="1000" height="300" rx="20" fill="#0E1B26"/>
  <rect x="1" y="1" width="998" height="298" rx="19" fill="none" stroke="#24405A" stroke-width="2"/>

  <!-- routing motif: one router node, three specialists -->
  <g aria-hidden="true">
    <path d="M806 84 L892 48 M806 84 L892 84 M806 84 L892 120" stroke="#3B5B78" stroke-width="1.5" fill="none"/>
    <circle cx="806" cy="84" r="16" fill="none" stroke="#E6B450" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="806" cy="84" r="8" fill="#E6B450"/>
    <circle cx="896" cy="48"  r="6" fill="#7FB99A"/>
    <circle cx="896" cy="84"  r="6" fill="#7FB99A"/>
    <circle cx="896" cy="120" r="6" fill="#7FB99A"/>
  </g>

  <!-- identity -->
  <text class="sans" x="56" y="120" font-size="74" font-weight="700" fill="#E8EEF3" letter-spacing="-1.5">Ahmad Ishaq</text>
  <text class="sans" x="57" y="168" font-size="28" fill="#8FA3B5">Computer Science student building AI &amp; agentic AI systems</text>
  <rect x="57" y="196" width="64" height="4" rx="2" fill="#E6B450"/>

  <!-- agent motif: understand → route → use tools → respond -->
  <g class="mono" font-size="24">
    <g class="step s1">
      <text x="57" y="252" fill="#E8EEF3">understand</text>
      <path d="M222 245 H246 M240 239 L246 245 L240 251" stroke="#E6B450" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="step s2">
      <text x="266" y="252" fill="#E8EEF3">route</text>
      <path d="M356 245 H380 M374 239 L380 245 L374 251" stroke="#E6B450" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="step s3">
      <text x="400" y="252" fill="#E8EEF3">use tools</text>
      <path d="M546 245 H570 M564 239 L570 245 L564 251" stroke="#E6B450" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="step s4">
      <text x="590" y="252" fill="#E6B450" font-weight="700">respond</text>
    </g>
    <rect class="cursor" x="712" y="232" width="11" height="26" fill="#E6B450"/>
  </g>
</svg>
